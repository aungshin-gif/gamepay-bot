<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #f5f5f5; padding: 15px; font-family: sans-serif; }
        .btn {
            display: block; width: 100%; padding: 15px; margin-bottom: 12px;
            border: none; border-radius: 12px; color: white; font-weight: bold;
            font-size: 17px; cursor: pointer; text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .green { background-color: #4CAF50; } /* Game Top Up အတွက် အစိမ်း */
        .blue { background-color: #2196F3; }  /* Digital Products အတွက် အပြာ */
        .red { background-color: #f44336; }   /* Back အတွက် အနီ */
    </style>
</head>
<body>
    <h3 style="text-align:center;">Choose Category</h3>
    <button class="btn green" onclick="send('cat:game')">🎮 Game Top Up</button>
    <button class="btn blue" onclick="send('cat:digital')">💻 Digital Products</button>
    <button class="btn red" onclick="send('back_main')">⬅️ Back</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        function send(data) {
            tg.sendData(data); // Bot ဆီကို data ပို့မယ်
            tg.close();
        }
    </script>
</body>
</html>
